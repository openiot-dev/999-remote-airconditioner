version: 1
applications:
  # 두 앱은 각각 별도의 Amplify 앱으로 만들고, 둘 다 SSR(WEB_COMPUTE)로 배포됩니다.
  #
  # Amplify 앱마다 환경변수 AMPLIFY_MONOREPO_APP_ROOT 를 아래 appRoot 와 글자 하나까지 같게 넣습니다.
  # 다르면 저장소를 받자마자 아래 오류로 멈추고, 설치나 빌드는 시작도 하지 않습니다.
  #   CustomerError: Invalid monorepo spec, no matching appRoot found in build spec
  # 앱을 만들 때 "My app is a monorepo" 경로에 앱 폴더까지(dev/frontend/user-app) 적으면 자동으로 들어갑니다.
  # dev/frontend 까지만 적으면 맞는 블록이 없어 같은 오류가 납니다.
  #
  # 경로를 잘못 적은 채 만든 앱은 Next.js 를 알아보지 못해 정적 호스팅(WEB)으로 만들어집니다.
  # 이 상태에서 경로만 고치면 빌드는 되어도 SSR 결과물(.next)을 정적 파일로 올리게 되어 제대로 서비스되지 않습니다.
  # 경로를 고친 뒤에는 플랫폼도 확인하고, WEB 이면 SSR 로 바꾼 다음 다시 배포합니다.
  #   aws amplify get-app --region ap-northeast-2 --app-id <앱ID> --query app.platform   # WEB_COMPUTE 여야 합니다
  #   aws amplify update-app --region ap-northeast-2 --app-id <앱ID> --platform WEB_COMPUTE
  #   aws amplify update-branch --region ap-northeast-2 --app-id <앱ID> --branch-name main --framework "Next.js - SSR"

  # ── 사용자 앱 (dev/frontend/user-app) ──────────────────────────────
  # AMPLIFY_MONOREPO_APP_ROOT = dev/frontend/user-app
  - appRoot: dev/frontend/user-app
    frontend:
      phases:
        preBuild:
          commands:
            # SSR 빌드는 Node 18 이하면 Amplify 가 막고, Tailwind v4 는 20 이상을 요구합니다.
            # 콘솔 설정(live package updates)에 기대지 않고 여기서 고정합니다. 이미지에 없으면 설치합니다.
            - nvm use 22 || nvm install 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # NEXT_PUBLIC_ 값은 빌드 때 화면 코드에 박히므로 따로 넘기지 않아도 됩니다.
            # 서버에서만 읽는 값을 추가하면 관리자 콘솔처럼 .env.production 으로 남겨야 합니다.
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - .npm/**/*

  # ── 관리자 콘솔 (dev/frontend/admin-console) ──────────────────────
  # AMPLIFY_MONOREPO_APP_ROOT = dev/frontend/admin-console
  - appRoot: dev/frontend/admin-console
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm install 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Amplify 콘솔 환경변수는 빌드까지만 전달되고, 요청을 받는 서버(미들웨어, /api/auth/*)에는 가지 않습니다.
            # 그대로 두면 배포본은 설정이 없는 것으로 보고 /admin 을 503 으로 잠급니다.
            # 그래서 서버가 읽을 값만 골라 파일로 남깁니다. 이 파일은 빌드 안에서만 생기고 저장소에는 올라가지 않습니다.
            # Cognito 값을 아직 넣지 않은 첫 배포에서는 고를 값이 없어 grep 이 실패하므로 || true 로 빌드를 이어갑니다.
            - env | grep -E '^(COGNITO_|SESSION_|API_)' > .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - .npm/**/*
